[package]
name = "ioc-extractor"
version = "0.1.0"
edition = "2021"
description = "IOC extractor for Triage Desk — compiled to WASM"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
regex-lite = "0.1"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
